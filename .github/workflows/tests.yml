name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples,course,showcase,apps]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests, doctests and examples
        run: pytest --cov=fluidmech --cov-report=term-missing
      - name: Validation against reference data
        run: python docs/validate.py
      - name: Command-line interface
        run: fluidmech pipe -Q 0.02 -D 0.1 -L 200 -e commercial_steel

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[examples]" nbmake ipykernel
      - name: Execute tutorial notebooks
        run: pytest --nbmake notebooks/ -p no:doctest -o addopts=""
