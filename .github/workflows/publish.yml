# Publishes to PyPI when a GitHub release is created.
# One-time setup: on pypi.org add this repository as a "trusted publisher"
# (Account settings -> Publishing), then create a release with a tag like v0.3.0.
name: publish

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
