[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluidmech"
version = "0.5.0"
description = "Engineering fluid mechanics in pure Python: pipes, networks, pumps, open channels, compressible flow and water hammer."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yanwei Wang", email = "wangyanwei@gmail.com" }]
keywords = ["fluid mechanics", "hydraulics", "engineering", "pipe flow", "open channel", "pipe network", "pumps", "compressible flow", "water hammer", "civil engineering", "mechanical engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.optional-dependencies]
examples = ["numpy", "matplotlib"]
dev = ["pytest>=7", "pytest-cov", "ruff"]
notebooks = ["jupyter", "numpy", "matplotlib"]
course = ["numpy", "matplotlib", "sympy"]
showcase = ["numpy", "scipy", "matplotlib", "pillow"]
apps = ["streamlit", "numpy", "matplotlib"]
all = ["numpy", "scipy", "matplotlib", "pillow", "sympy", "streamlit", "jupyter"]

[project.scripts]
fluidmech = "fluidmech.cli:main"

[project.urls]
Homepage = "https://github.com/ktwyw/fluidmech"
Issues = "https://github.com/ktwyw/fluidmech/issues"
Changelog = "https://github.com/ktwyw/fluidmech/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/fluidmech"]
addopts = "-ra --doctest-modules"
# doctests in the package source are collected too


[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["notebooks"]  # notebooks are checked by executing them in CI

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# teaching scripts print wide result tables from long f-strings
"course/**" = ["E501"]
"showcase/**" = ["E501"]
